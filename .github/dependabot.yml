# This repository is a maintained build of the retired kubernetes/ingress-nginx
# controller-v1.15.1. Dependencies of the controller and the test images are
# kept as upstream left them; they are only updated for security fixes, which
# come from Dependabot security updates (enabled in the repository settings).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "area/dependency"
    groups:
      actions:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
