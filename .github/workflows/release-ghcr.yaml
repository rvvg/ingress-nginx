name: Release (GHCR)

# Builds multi-arch (amd64, arm64) NGINX base and controller images, pushes them
# to ghcr.io/<owner>/ingress-nginx/* and publishes the Helm chart as an OCI
# artifact to oci://ghcr.io/<owner>/charts/ingress-nginx.
#
# Versions are derived from the repository:
#   base image:  images/nginx/TAG
#   controller:  v<Chart.yaml appVersion>-nginx-<NGINX_VERSION>[-r<revision>]
#   chart:       <Chart.yaml version>-nginx-<NGINX_VERSION>[-r<revision>]

on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Optional revision suffix (e.g. 2 -> "-r2") to rebuild without an NGINX bump'
        required: false
        type: string
        default: ''
      rebuild-base:
        description: 'Rebuild the NGINX base image even if its tag already exists'
        required: false
        type: boolean
        default: false
      force:
        description: 'Overwrite an already published controller tag'
        required: false
        type: boolean
        default: false
      chart-only:
        description: 'Republish only the Helm chart (and release notes) for already published images'
        required: false
        type: boolean
        default: false
      changes:
        description: 'Markdown list of changes for the release notes (default: commit subjects since the previous release)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-ghcr
  cancel-in-progress: false

jobs:
  meta:
    name: Versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      registry: ${{ steps.versions.outputs.registry }}
      chart-registry: ${{ steps.versions.outputs.chart-registry }}
      base-tag: ${{ steps.versions.outputs.base-tag }}
      controller-tag: ${{ steps.versions.outputs.controller-tag }}
      chart-version: ${{ steps.versions.outputs.chart-version }}
      build-base: ${{ steps.check.outputs.build-base }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Compute versions
        id: versions
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          nginx="$(sed -n 's/^export NGINX_VERSION=//p' images/nginx/rootfs/build.sh)"
          app="$(yq -r .appVersion charts/ingress-nginx/Chart.yaml)"
          chart="$(yq -r .version charts/ingress-nginx/Chart.yaml)"
          suffix="-nginx-${nginx}"
          if [[ -n "${REVISION}" ]]; then
            [[ "${REVISION}" =~ ^[0-9]+$ ]] || { echo "revision must be a number"; exit 1; }
            suffix+="-r${REVISION}"
          fi
          {
            echo "registry=ghcr.io/${owner}/ingress-nginx"
            echo "chart-registry=ghcr.io/${owner}/charts"
            echo "base-tag=$(cat images/nginx/TAG)"
            echo "controller-tag=v${app}${suffix}"
            echo "chart-version=${chart}${suffix}"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check existing images
        id: check
        env:
          REGISTRY: ${{ steps.versions.outputs.registry }}
          BASE_TAG: ${{ steps.versions.outputs.base-tag }}
          CONTROLLER_TAG: ${{ steps.versions.outputs.controller-tag }}
          REBUILD_BASE: ${{ inputs.rebuild-base }}
          FORCE: ${{ inputs.force }}
          CHART_ONLY: ${{ inputs.chart-only }}
        run: |
          if [[ "${CHART_ONLY}" == "true" ]]; then
            docker buildx imagetools inspect "${REGISTRY}/controller:${CONTROLLER_TAG}" >/dev/null \
              || { echo "::error::chart-only needs a published ${REGISTRY}/controller:${CONTROLLER_TAG}"; exit 1; }
            echo "build-base=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${REBUILD_BASE}" != "true" ]] && docker buildx imagetools inspect "${REGISTRY}/nginx:${BASE_TAG}" >/dev/null 2>&1; then
            echo "Base image ${REGISTRY}/nginx:${BASE_TAG} already exists, reusing it."
            echo "build-base=false" >> "$GITHUB_OUTPUT"
          else
            echo "build-base=true" >> "$GITHUB_OUTPUT"
          fi
          if [[ "${FORCE}" != "true" ]] && docker buildx imagetools inspect "${REGISTRY}/controller:${CONTROLLER_TAG}" >/dev/null 2>&1; then
            echo "::error::${REGISTRY}/controller:${CONTROLLER_TAG} already exists. Set a revision or use force."
            exit 1
          fi

  base:
    name: Base image (${{ matrix.arch }})
    needs: meta
    if: needs.meta.outputs.build-base == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      REGISTRY: ${{ needs.meta.outputs.registry }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        run: |
          docker buildx build \
            --platform "linux/${{ matrix.arch }}" \
            --provenance=false \
            --output "type=image,name=${REGISTRY}/nginx,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file /tmp/metadata.json \
            images/nginx/rootfs
          mkdir -p /tmp/digests
          jq -r '."containerimage.digest"' /tmp/metadata.json > "/tmp/digests/${{ matrix.arch }}"

      - name: Upload digest
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: base-digest-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.arch }}
          retention-days: 1

  base-manifest:
    name: Base image manifest
    needs: [meta, base]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ${{ needs.meta.outputs.registry }}
      BASE_TAG: ${{ needs.meta.outputs.base-tag }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: base-digest-*
          merge-multiple: true
          path: /tmp/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list
        run: |
          sources=()
          for f in /tmp/digests/*; do sources+=("${REGISTRY}/nginx@$(cat "$f")"); done
          docker buildx imagetools create -t "${REGISTRY}/nginx:${BASE_TAG}" "${sources[@]}"
          docker buildx imagetools inspect "${REGISTRY}/nginx:${BASE_TAG}"

  controller:
    name: Controller (${{ matrix.arch }})
    needs: [meta, base-manifest]
    if: ${{ !failure() && !cancelled() && !inputs.chart-only }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      REGISTRY: ${{ needs.meta.outputs.registry }}
      BASE_TAG: ${{ needs.meta.outputs.base-tag }}
      CONTROLLER_TAG: ${{ needs.meta.outputs.controller-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          driver: docker

      - name: Login to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build images
        run: |
          base_digest="$(docker buildx imagetools inspect "${REGISTRY}/nginx:${BASE_TAG}" --format '{{json .Manifest}}' | jq -r .digest)"
          make \
            ARCH=${{ matrix.arch }} \
            TAG="${CONTROLLER_TAG}" \
            REGISTRY="${REGISTRY}" \
            BASE_IMAGE="${REGISTRY}/nginx:${BASE_TAG}@${base_digest}" \
            build image image-chroot

      - name: Push images
        run: |
          for image in controller controller-chroot; do
            # The upstream Dockerfile labels the image with kubernetes/ingress-nginx as source. GHCR links packages
            # to the repository named in that label and then denies pushes with this repository's GITHUB_TOKEN.
            echo "FROM ${REGISTRY}/${image}:${CONTROLLER_TAG}" | docker build \
              --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              --tag "${REGISTRY}/${image}:${CONTROLLER_TAG}-${{ matrix.arch }}" \
              -
            docker push "${REGISTRY}/${image}:${CONTROLLER_TAG}-${{ matrix.arch }}"
          done

  controller-manifest:
    name: Controller manifest
    needs: [meta, controller]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.manifest.outputs.controller }}
      digest-chroot: ${{ steps.manifest.outputs.controller-chroot }}
    env:
      REGISTRY: ${{ needs.meta.outputs.registry }}
      CONTROLLER_TAG: ${{ needs.meta.outputs.controller-tag }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest lists
        id: manifest
        run: |
          for image in controller controller-chroot; do
            ref="${REGISTRY}/${image}:${CONTROLLER_TAG}"
            if [[ "${{ inputs.chart-only }}" != "true" ]]; then
              docker buildx imagetools create -t "${ref}" "${ref}-amd64" "${ref}-arm64"
            fi
            digest="$(docker buildx imagetools inspect "${ref}" --format '{{json .Manifest}}' | jq -r .digest)"
            echo "${ref}@${digest}"
            echo "${image}=${digest}" >> "$GITHUB_OUTPUT"
          done

  chart:
    name: Helm chart
    needs: [meta, controller-manifest]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ${{ needs.meta.outputs.registry }}
      CHART_REGISTRY: ${{ needs.meta.outputs.chart-registry }}
      CONTROLLER_TAG: ${{ needs.meta.outputs.controller-tag }}
      CHART_VERSION: ${{ needs.meta.outputs.chart-version }}
      DIGEST: ${{ needs.controller-manifest.outputs.digest }}
      DIGEST_CHROOT: ${{ needs.controller-manifest.outputs.digest-chroot }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # artifacthub.io/changes lists the commits since the previous release tag.
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.1.3

      - name: Set image defaults
        run: |
          # The chart builds the image as <registry>/<image>, where image is "ingress-nginx/controller".
          export IMAGE_REGISTRY="${REGISTRY%/ingress-nginx}"
          yq -i '
            .controller.image.registry = strenv(IMAGE_REGISTRY) |
            .controller.image.tag = strenv(CONTROLLER_TAG) |
            .controller.image.digest = strenv(DIGEST) |
            .controller.image.digestChroot = strenv(DIGEST_CHROOT)
          ' charts/ingress-nginx/values.yaml
          git diff charts/ingress-nginx/values.yaml

      - name: Set chart metadata
        env:
          CHANGES: ${{ inputs.changes }}
        run: |
          # Chart.yaml in the repository describes the upstream project; the published chart points to this one.
          export REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          export OWNER="${GITHUB_REPOSITORY_OWNER}"
          export NGINX_VERSION="$(sed -n 's/^export NGINX_VERSION=//p' images/nginx/rootfs/build.sh)"
          export CHANGES="$(hack/ghcr-release-changes.sh | python3 -I hack/artifacthub-changes.py)"
          export IMAGES="- name: controller
            image: ${REGISTRY}/controller:${CONTROLLER_TAG}@${DIGEST}
            platforms: [linux/amd64, linux/arm64]
          - name: controller-chroot
            image: ${REGISTRY}/controller-chroot:${CONTROLLER_TAG}@${DIGEST_CHROOT}
            platforms: [linux/amd64, linux/arm64]
          "
          export LINKS="- name: Upstream (retired)
            url: https://github.com/kubernetes/ingress-nginx
          "
          yq -i '
            .description = "Ingress controller for Kubernetes using NGINX as a reverse proxy and load balancer. Maintained build of the retired kubernetes/ingress-nginx on NGINX " + strenv(NGINX_VERSION) + "." |
            .home = strenv(REPO_URL) |
            .sources = [strenv(REPO_URL), "https://github.com/kubernetes/ingress-nginx"] |
            .maintainers = [{"name": strenv(OWNER), "url": "https://github.com/" + strenv(OWNER)}] |
            .keywords += ["ingress-nginx", "ingress-controller", "openresty"] |
            .annotations."artifacthub.io/changes" = strenv(CHANGES) |
            .annotations."artifacthub.io/images" = strenv(IMAGES) |
            .annotations."artifacthub.io/links" = strenv(LINKS) |
            .annotations."artifacthub.io/license" = "Apache-2.0"
          ' charts/ingress-nginx/Chart.yaml
          cat charts/ingress-nginx/Chart.yaml

      - name: Package and push
        run: |
          helm package charts/ingress-nginx --version "${CHART_VERSION}" --app-version "${CONTROLLER_TAG#v}" --destination /tmp/chart
          helm template test /tmp/chart/ingress-nginx-${CHART_VERSION}.tgz | grep -E '^\s+image: .*/controller:'
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push "/tmp/chart/ingress-nginx-${CHART_VERSION}.tgz" "oci://${CHART_REGISTRY}"

      - name: Summary
        run: |
          {
            echo "### Published"
            echo "- \`${REGISTRY}/controller:${CONTROLLER_TAG}@${DIGEST}\`"
            echo "- \`${REGISTRY}/controller-chroot:${CONTROLLER_TAG}@${DIGEST_CHROOT}\`"
            echo "- \`oci://${CHART_REGISTRY}/ingress-nginx\` version \`${CHART_VERSION}\`"
            echo
            echo '```'
            echo "helm upgrade --install ingress-nginx oci://${CHART_REGISTRY}/ingress-nginx --version ${CHART_VERSION} -n ingress-nginx --create-namespace"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  artifacthub:
    name: Artifact Hub metadata
    needs: chart
    if: ${{ !failure() && !cancelled() }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/artifacthub-ghcr.yaml

  sign:
    name: Sign
    needs: [meta, chart]
    if: ${{ !failure() && !cancelled() }}
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/sign-ghcr.yaml
    with:
      base-tag: ${{ needs.meta.outputs.base-tag }}
      controller-tag: ${{ needs.meta.outputs.controller-tag }}
      chart-version: ${{ needs.meta.outputs.chart-version }}

  github-release:
    name: GitHub release
    needs: [meta, controller-manifest, sign]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The release notes list the commits since the previous release tag.
          fetch-depth: 0

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGES: ${{ inputs.changes }}
          REGISTRY: ${{ needs.meta.outputs.registry }}
          CHART_REGISTRY: ${{ needs.meta.outputs.chart-registry }}
          BASE_TAG: ${{ needs.meta.outputs.base-tag }}
          CONTROLLER_TAG: ${{ needs.meta.outputs.controller-tag }}
          CHART_VERSION: ${{ needs.meta.outputs.chart-version }}
          DIGEST: ${{ needs.controller-manifest.outputs.digest }}
          DIGEST_CHROOT: ${{ needs.controller-manifest.outputs.digest-chroot }}
        run: |
          hack/ghcr-release-notes.sh > /tmp/notes.md
          cat /tmp/notes.md
          if gh release view "${CONTROLLER_TAG}" >/dev/null 2>&1; then
            gh release edit "${CONTROLLER_TAG}" --notes-file /tmp/notes.md
          else
            gh release create "${CONTROLLER_TAG}" --target "${GITHUB_SHA}" --title "${CONTROLLER_TAG}" --notes-file /tmp/notes.md --latest
          fi
