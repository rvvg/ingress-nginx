name: Artifact Hub metadata (GHCR)

# Artifact Hub reads repository metadata (verified publisher) from the "artifacthub.io" tag of an OCI chart.
# Pushes charts/artifacthub-repo.yml there. Called by Release (GHCR); can be run by hand after editing the file.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push:
    name: Push metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up ORAS
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Push metadata
        working-directory: charts
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io --username "${{ github.actor }}" --password-stdin
          oras push "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts/ingress-nginx:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
